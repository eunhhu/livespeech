<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1115" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>LiveSpeech</title>
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="topbar">
      <h1>LiveSpeech</h1>
      <span id="status" class="pill" data-status="idle">대기</span>
    </header>

    <section id="settings" class="settings">
      <div class="seg" role="radiogroup" aria-label="모드">
        <button type="button" role="radio" data-mode="converse">대화 · 양방향</button>
        <button type="button" role="radio" data-mode="listen">듣기 · 단방향</button>
      </div>

      <div class="langs">
        <label class="field">
          <span id="myLangLabel">나</span>
          <select id="myLang"></select>
        </label>
        <button type="button" id="swap" class="swap" aria-label="언어 바꾸기">⇄</button>
        <label class="field" id="partnerField">
          <span>상대</span>
          <select id="partnerLang"></select>
        </label>
      </div>

      <label class="toggle">
        <input type="checkbox" id="halfDuplex" />
        <span>
          스피커 모드 (순차 통역)
          <small>말이 끝나면 번역을 들려주고, 재생 중엔 마이크를 쉬어 에코를 막아요. 이어폰이면 끄세요 (동시 통역).</small>
        </span>
      </label>

      <label class="field" id="accessRow" hidden>
        <span>접근 코드</span>
        <input id="accessCode" type="password" autocomplete="off" />
      </label>
    </section>

    <div id="notice" class="notice" role="status" hidden></div>

    <main id="transcript" class="transcript" aria-live="polite">
      <p class="empty" id="empty">마이크 버튼을 눌러 통역을 시작하세요.</p>
    </main>

    <footer class="controls">
      <button type="button" id="mic" class="mic" aria-label="통역 시작" aria-pressed="false">
        <span class="ring" aria-hidden="true"></span>
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Z" />
          <path d="M19 11a7 7 0 0 1-14 0M12 18v3" fill="none" stroke-width="2" stroke-linecap="round" />
        </svg>
      </button>
      <p id="hint" class="hint"></p>
    </footer>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
